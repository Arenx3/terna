[project]
name = "terna-backend"
version = "0.1.0"
description = "Terna API, WebSockets and background workers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.35,<2",
    "celery[redis]>=5.5,<6",
    "channels>=4.2,<5",
    "channels-redis>=4.2,<5",
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.28,<1",
    "drf-spectacular-sidecar>=2025.1",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "uvicorn[standard]>=0.30",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "ruff>=0.17",
]
ml = [
    "snowballstemmer>=2.2,<4",
    "spacy>=3.8,<3.9",
    "xx-ent-wiki-sm",
]
# The embedding model only runs on the ml worker. Torch comes from its CPU-only index:
# the default wheels bundle CUDA, gigabytes the worker never uses.
embeddings = [
    "sentence-transformers>=5,<6",
    "torch>=2.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
xx-ent-wiki-sm = { url = "https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "B",   # bugbear
    "DJ",  # django
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # pytest style
    "RUF", # ruff-specific
    "S",   # bandit (security)
    "SIM", # simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
# Résumés and their date ranges are written with en dashes ("2019 – 2024").
allowed-confusables = ["–", "’"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
# Django declares migrations and Meta options as class-level lists by design.
"**/migrations/**" = ["RUF012", "E501"]
"**/serializers.py" = ["RUF012"]
"**/views.py" = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
addopts = "-ra --strict-markers -p no:cacheprovider"
python_files = ["test_*.py"]
markers = ["integration: needs the running stack (workers, broker)"]
