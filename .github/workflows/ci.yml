name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: |
          pip install pre-commit==4.7.0
          pre-commit run --all-files --show-diff-on-failure --color always

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same images and services as local development: the compose `test` profile.
      - name: Build images
        run: docker compose --profile test build tests bootstrap

      - name: Run backend tests
        run: docker compose --profile test run --rm tests

      - name: Show service logs
        if: failure()
        run: docker compose --profile test logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile test down --volumes

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

  smoke:
    name: Stack smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The end-to-end tests sign up several times, retries included.
      AUTH_SIGNUP_RATE: 100/hour
      APPLY_RATE: 100/hour
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails if any service is unhealthy or any one-shot service exits non-zero.
      - name: Start the stack
        run: docker compose up --detach --build --wait --wait-timeout 300

      - name: Run smoke checks
        run: python3 scripts/smoke_test.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check the typed API client matches the live schema
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error file=frontend/src/api/schema.d.ts::Out of date. Run 'npm run api:types' with the stack up and commit the result."
            exit 1
          }

      # Real browser against the real stack, reading the emails it sends through Mailpit.
      - name: Run end-to-end tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Show stack state and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
