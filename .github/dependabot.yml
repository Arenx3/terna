version: 2

# Weekly, grouped by ecosystem so minor and patch bumps arrive as one PR each.
# Major versions come one by one: they are the ones that need reading.

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # Django stays on the 5.2 LTS line: security patches arrive as usual, and the
    # move to the next LTS is a planned change, not a weekly bump.
    ignore:
      - dependency-name: django
        versions: [">=5.3"]
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /nginx]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      dockerfiles:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      compose:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit:
        update-types: [minor, patch]
