# Docker's embedded DNS, re-resolved so a restarted backend keeps receiving traffic.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;
    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Empty for plain requests (keeps upstream keepalive), "upgrade" for WebSockets.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend;
    }

    # Django's static files (API docs), served by WhiteNoise with long-lived cache headers.
    location /static/ {
        proxy_pass http://backend;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://backend;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_read_timeout 1h;
    }

    # Vite fingerprints these file names, so they never change in place.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app shell must always be revalidated, or a deploy would keep serving old asset names.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Client-side routes fall back to the app shell.
    location / {
        try_files $uri /index.html;
    }
}
